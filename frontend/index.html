
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>FleetPro - Fleet Management System</title>
    </head>

    <body>
      <div id="root"></div>
      <noscript>
        <div class="min-h-screen flex items-center justify-center p-8">
          <h1 class="text-2xl font-bold text-red-600">JavaScript is required to run this application.</h1>
        </div>
      </noscript>
      <script>
        // catch fatal errors before React renders
        window.addEventListener('error', function (event) {
          document.body.innerHTML = `<div class="min-h-screen flex items-center justify-center p-8"><div><h1 class="text-2xl font-bold text-red-600">An unexpected error occurred</h1><pre>${event.message}</pre></div></div>`;
        });
        window.addEventListener('unhandledrejection', function (event) {
          document.body.innerHTML = `<div class="min-h-screen flex items-center justify-center p-8"><div><h1 class="text-2xl font-bold text-red-600">Unhandled promise rejection</h1><pre>${event.reason}</pre></div></div>`;
        });
      </script>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
